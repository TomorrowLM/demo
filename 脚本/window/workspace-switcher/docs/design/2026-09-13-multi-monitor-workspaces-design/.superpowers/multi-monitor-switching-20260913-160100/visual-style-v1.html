<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorkspaceSwitcher 视觉修复目标</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(circle at 18% 12%, rgba(89, 143, 194, .65), transparent 33%),
        radial-gradient(circle at 82% 78%, rgba(171, 87, 104, .58), transparent 38%),
        linear-gradient(135deg, #172b40 0%, #31435b 48%, #4c324a 100%);
    }
    .stage {
      width: min(720px, 100%);
    }
    .caption {
      margin: 0 0 14px;
      color: rgba(255,255,255,.8);
      font-size: 14px;
      letter-spacing: .04em;
    }
    .panel {
      width: 520px;
      max-width: 100%;
      min-height: 690px;
      margin-left: auto;
      padding: 10px 20px 28px;
      border-radius: 20px;
      background: rgba(40, 35, 52, .62);
      backdrop-filter: blur(24px) saturate(1.25);
      -webkit-backdrop-filter: blur(24px) saturate(1.25);
      border: 1px solid rgba(255,255,255,.18);
      box-shadow: 0 14px 40px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.06);
    }
    .toolbar {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      height: 40px;
    }
    button, .tab {
      border: 1px solid rgba(255,255,255,.5);
      border-radius: 10px;
      background: rgba(255,255,255,.93);
      color: #173b68;
      font: 16px/1 "Microsoft YaHei UI", "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      text-align: center;
      white-space: nowrap;
    }
    button { height: 40px; padding: 0 16px; }
    .filters {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin: 4px 0 22px;
    }
    .tab { height: 42px; }
    .tab.active {
      color: #2563d8;
      border-color: #5b8df2;
      background: rgba(239,245,255,.96);
    }
    .card {
      margin-bottom: 12px;
      padding: 14px 13px;
      border-radius: 18px;
      background: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.68);
      color: #12243d;
    }
    .title {
      display: flex;
      align-items: center;
      gap: 12px;
      height: 40px;
      font-size: 28px;
      font-weight: 700;
    }
    .index { color: #3276e8; }
    .app {
      height: 38px;
      width: fit-content;
      max-width: 100%;
      margin-top: 6px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      border: 1px solid #d8e2f2;
      border-radius: 10px;
      color: #17345c;
      font-size: 20px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .add {
      height: 158px;
      display: grid;
      place-items: center;
      align-content: center;
      gap: 8px;
      text-align: center;
      border-style: dashed;
    }
    .plus { color: #6d8fc4; font-size: 28px; line-height: 1; }
    .add strong { font-size: 27px; }
    .hint { color: #6e87aa; font-size: 17px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .grid .card { min-height: 112px; }
    .active-card { background: rgba(235,243,255,.94); border-color: #5b8df2; }
  </style>
</head>
<body>
  <main class="stage">
    <p class="caption">视觉修复目标：统一字号、真实水平/垂直居中、外沿只保留一条低亮度边框</p>
    <section class="panel" aria-label="WorkspaceSwitcher 视觉目标">
      <div class="toolbar">
        <button>刷新工作区</button>
        <button>隐藏</button>
      </div>
      <div class="filters">
        <div class="tab active">全部</div>
        <div class="tab">显示器 1</div>
        <div class="tab">显示器 2</div>
      </div>
      <article class="card">
        <div class="title"><span class="index">01</span><span>工作区 1</span></div>
        <div class="app">•　Clash for Windows</div>
        <div class="app">•　Google Chrome — Chrome Issues…</div>
      </article>
      <article class="card add">
        <div class="plus">＋</div>
        <strong>新增工作区</strong>
        <div class="hint">点击创建，或把窗口拖到这里</div>
      </article>
      <div class="grid">
        <article class="card active-card">
          <div class="title"><span class="index">02</span><span>当前工作区</span></div>
          <div class="app">•　ChatGPT</div>
        </article>
        <article class="card">
          <div class="title"><span>03</span><span>工作区 2</span></div>
          <div class="app">•　VS Code…</div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
